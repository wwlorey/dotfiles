# aichat — HIPAA-compliant Vertex AI setup
# Auth: gcloud Application Default Credentials (ADC).
#   Run once:  gcloud auth application-default login
# Project ID is resolved from $GOOGLE_CLOUD_HIPAA_PROJECT_ID (client name =
# google_cloud_hipaa), kept OUT of this file so it's safe to commit publicly.
# Set that variable in your private dotfiles (~/Sync/.dotfiles), e.g.:
#   export GOOGLE_CLOUD_HIPAA_PROJECT_ID="your-hipaa-project-id"
# All traffic stays inside your BAA-covered Vertex project.

model: google_cloud_hipaa:gemini-2.5-flash-lite   # default: GA, cheap, HIPAA-eligible
stream: true
save: false            # do NOT persist sessions/messages to disk (PHI hygiene)
save_session: false

clients:
  - type: vertexai
    name: google_cloud_hipaa
    location: us-central1
    # project_id resolved from $GOOGLE_CLOUD_HIPAA_PROJECT_ID at request time.
    # Declaring models: overrides aichat's built-in catalog for this client,
    # so we list every GA model we want. All GA => HIPAA-eligible under the BAA.
    models:
      - name: gemini-2.5-flash-lite      # cheapest daily driver
        max_input_tokens: 1000000
        max_output_tokens: 65536
        input_price: 0.10
        output_price: 0.40
        supports_vision: true
        supports_function_calling: true
      - name: gemini-2.5-flash           # step up for nuance/tone
        max_input_tokens: 1000000
        max_output_tokens: 65536
        input_price: 0.30
        output_price: 2.50
        supports_vision: true
        supports_function_calling: true
      - name: gemini-2.5-pro             # most performant model reachable from
        # us-central1 in aichat 0.30.0; >200k-token prompts bill at a higher tier
        max_input_tokens: 1000000
        max_output_tokens: 65536
        input_price: 1.25
        output_price: 10.00
        supports_vision: true
        supports_function_calling: true
      # gemini-3.5-flash is GA (2026-05-19) and BAA-eligible, but Vertex serves
      # it from the GLOBAL endpoint only — no us-central1 — and aichat 0.30.0
      # cannot build the global-endpoint URL (it always prefixes the region onto
      # the hostname). Declared so the allowlist is ready; requests fail with
      # NOT_FOUND until aichat is upgraded, location handling re-audited, and
      # the global endpoint's "no in-region processing guarantee" accepted.
      - name: gemini-3.5-flash
        max_input_tokens: 1000000
        max_output_tokens: 65536
        input_price: 1.50
        output_price: 9.00
        supports_vision: true
        supports_function_calling: true
      # Gemini 3.1 Pro exists ONLY as gemini-3.1-pro-preview — pre-GA, which
      # Google's HIPAA terms exclude from PHI use. Do not add it here.
