# aichat — HIPAA-compliant Vertex AI setup
# Auth: gcloud Application Default Credentials (ADC).
#   Run once:  gcloud auth application-default login
# Project ID is resolved from $GOOGLE_CLOUD_HIPAA_PROJECT_ID (client name =
# google_cloud_hipaa), kept OUT of this file so it's safe to commit publicly.
# Set that variable in your private dotfiles (~/Sync/.dotfiles), e.g.:
#   export GOOGLE_CLOUD_HIPAA_PROJECT_ID="your-hipaa-project-id"
# All traffic stays inside your BAA-covered Vertex project.

model: google_cloud_hipaa:gemini-2.5-flash-lite   # default: GA, cheap, HIPAA-eligible
stream: true
save: false            # do NOT persist sessions/messages to disk (PHI hygiene)
save_session: false
save_shell_history: false   # -e/.shell prompts (potential PHI) must not persist

# REPL prompt: default template minus the role segments ({?role /} and {role}).
# Under the gate, named roles (-r/--role) are blocked, so the only role ever
# active is the temporary one created by --prompt, which aichat displays as its
# TEMP_ROLE_NAME "%%". Dropping the role segments hides that noise, leaving a
# clean "<session>)" (in a session) or ">" (outside one).
left_prompt: '{color.green}{?session {?agent {agent}>}{session}}{!session {?agent {agent}>}}{?rag @{rag}}{color.cyan}{?session )}{!session >}{color.reset} '

clients:
  # Must use a real REGION, not "global": aichat 0.30.0 builds the vertexai host
  # as "{location}-aiplatform.googleapis.com" and does NOT special-case "global",
  # so location: global yields the invalid host "global-aiplatform.googleapis.com"
  # and every call fails. Consequence: the latest Gemini 3.x models are served
  # ONLY on the global endpoint, so they are UNREACHABLE from aichat 0.30.0 — we
  # are limited to the Gemini 2.5 family until aichat gains global support.
  - type: vertexai
    name: google_cloud_hipaa
    location: us-central1
    # Declaring models overrides aichat's built-in catalog for this client; list
    # GA models only. All GA => HIPAA-eligible under the BAA.
    models:
      - name: gemini-2.5-flash-lite      # default; cheapest daily driver
        max_input_tokens: 1000000
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true
      - name: gemini-2.5-flash           # step up for nuance/tone
        max_input_tokens: 1000000
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true
      - name: gemini-2.5-pro             # most performant reachable on us-central1
        max_input_tokens: 1000000
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true
